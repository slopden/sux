$header
[global]
    server role = standalone server
    server string = %h

    # Loopback only. Samba can't bind tailscale0 (point-to-point), so smbd-tailnet.socket
    # listens on the tailscale IPs and relays to here. Every client shows as 127.0.0.1.
    interfaces = lo
    bind interfaces only = yes
    hosts allow = 127.0.0.1 ::1
    server smb transports = 445
    server multi channel support = no
    disable netbios = yes
    multicast dns register = no

    # Logins with a Samba password only: no guest, no anonymous share listing.
    security = user
    passdb backend = tdbsam
    map to guest = never
    restrict anonymous = 2
    server min protocol = SMB3

    # No printers, no user-defined shares.
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    usershare max shares = 0

    logging = systemd
    log level = 1

    # macOS: Apple SMB extensions, Finder metadata in xattrs (ext4 has them),
    # mac-only filename characters mapped, atomic renames.
    vfs objects = catia fruit streams_xattr
    fruit:metadata = stream
    fruit:model = MacSamba
    fruit:posix_rename = yes
    fruit:veto_appledouble = no
    fruit:nfs_aces = no
    fruit:wipe_intentionally_left_blank_rfork = yes
    fruit:delete_empty_adfiles = yes
$shares
