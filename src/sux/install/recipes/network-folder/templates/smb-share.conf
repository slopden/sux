
[$share]
    path = $root
    valid users = $user
    read only = $read_only
    force user = $user
    force group = $group
    create mask = 0664
    directory mask = 0775
    # Follow symlinks only while they stay inside path (Samba's defaults, pinned here).
    follow symlinks = yes
    wide links = no
    # Hidden from the Mac: versitygw's in-progress multipart uploads, and Finder's .DS_Store
    # litter (which would otherwise show up as S3 objects). Deleting a folder still works.
    veto files = /.sgwtmp/.DS_Store/
    delete veto files = yes
