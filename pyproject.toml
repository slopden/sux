[project]
name = "sux"
version = "0.1.0"
description = "A tmux wrapper with sandboxing and screen keybindings"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
sux = "sux.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sux"]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
    "nuitka>=4.3.5",
    "patchelf>=0.19.3.0",
    "zstandard>=0.25.0",
    "pytest>=9.2.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["src/worktrees"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # pydocstyle
    "ANN",     # flake8-annotations
    "T20",     # flake8-print
    "S",       # bandit
    "EM",      # flake8-errmsg
    "TRY003",  # long exception messages
    "COM812",  # trailing comma conflicts with formatter
    "ISC001",  # implicit string concat conflicts with formatter
    "FBT",     # boolean trap
    "CPY001",  # copyright headers: covered by LICENSE
]

[tool.ruff.lint.per-file-ignores]
"src/sux/constants.py" = ["E501"]
"build/*" = ["E501", "INP001"]
"tests/*" = ["INP001", "PLR2004"]
# hooks.py is run by the engine, which provides Action, Probe, Fail ... as globals
"src/sux/install/recipes/*/hooks.py" = ["F821", "INP001"]

[tool.ruff.format]
quote-style = "double"
